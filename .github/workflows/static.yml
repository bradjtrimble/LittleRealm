name: Deploy Little Realm to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit workflow action versions
        run: python3 tools/workflow_audit.py

      - name: Build Little Realm bundles
        run: python3 tools/build.py

      - name: Validate Little Realm
        run: python3 tools/validate.py

      - name: Report build sizes
        run: python3 tools/size-report.py

      - name: Prepare production Pages artifact
        run: python3 tools/prepare-pages.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
