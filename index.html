<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1c1327">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icons/icon-512.png">
  <title>Little Realm RPG</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="gameShell">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hudTop">
      <span>Lv <span id="lvl">1</span></span>
      <span><span id="gold">8</span> gold</span>
    </div>
    <div class="small" style="margin-top:5px">HP <span id="hpText">30/30</span></div>
    <div class="bar"><div id="hpFill" class="fill"></div></div>
    <div class="small" style="margin-top:5px">XP <span id="xpText">0/25</span></div>
    <div class="bar"><div id="xpFill" class="fill"></div></div>
  </div>

  <button id="menuBtn">MENU</button>
  <div id="questChip">Slimes 0/3</div>
  <div id="toast"></div>
  <div id="pcControls" aria-hidden="true"></div>
  <div id="buildBadge" aria-hidden="true">v15 • PC CONTROLS ACTIVE</div>

  <div id="dpad">
    <div class="pad" id="up">▲</div>
    <div class="pad" id="left">◀</div>
    <div class="pad" id="right">▶</div>
    <div class="pad" id="down">▼</div>
  </div>

  <div id="actionHint">ATTACK<br>MOB</div>

  <div id="targetHud">
    <div id="targetHudTop"><span id="targetName">Target</span><span id="targetHpText">0/0</span></div>
    <div id="targetHpTrack"><div id="targetHpFill"></div></div>
    <div id="combatHint">Auto-attacking</div>
  </div>
  <button id="quickPotion">POTION 2</button>

  <div id="menu" class="overlay">
    <div class="panel">
      <h2>Hero</h2>
      <div class="infoGrid">
        <div class="infoBox">Attack<br><b id="mAtk">5</b></div>
        <div class="infoBox">Defense<br><b id="mDef">1</b></div>
        <div class="infoBox">Potions<br><b id="mPotions">2</b></div>
        <div class="infoBox">Kills<br><b id="mKills">0</b></div>
      </div>
      <div class="infoBox" style="margin-bottom:12px">
        <b>Quest</b><br>
        <span id="mQuest">Defeat 3 Slimes.</span>
      </div>
      <div class="infoBox" id="keybindList" style="margin-bottom:12px"></div>
      <div class="menuActions">
        <button class="action" id="saveBtn">Save</button>
        <button class="action" id="loadBtn">Load</button>
        <button class="action" id="fullBtn">Fullscreen</button>
        <button class="action" id="newBtn">New Game</button>
        <button class="action" id="closeMenu">Back to Game</button>
      </div>
    </div>
  </div>

  <div id="battle" class="overlay">
    <div id="battlePanel" class="panel">
      <div id="battleTopbar">
        <h2 id="battleTitle">Encounter</h2>
        <div id="battleTurn">YOUR TURN</div>
      </div>
      <div id="battleScene" data-kind="slime">
        <div id="heroStatus" class="battleStatus">
          <div class="statusTop"><span>Hero</span><span id="bHeroHp" class="statusHpText">30/30</span></div>
          <div class="battleHpTrack"><div id="bHeroHpFill" class="battleHpFill"></div></div>
        </div>
        <div id="enemyStatus" class="battleStatus">
          <div class="statusTop"><span id="bEnemyName">Enemy</span><span id="bEnemyHp" class="statusHpText">0/0</span></div>
          <div class="battleHpTrack"><div id="bEnemyHpFill" class="battleHpFill"></div></div>
        </div>
        <div id="enemyIntent">Enemy is preparing an attack...</div>
        <div id="battleGroundShadowHero"></div>
        <div id="battleGroundShadowEnemy"></div>
        <canvas id="heroBattleSprite" width="48" height="66"></canvas>
        <canvas id="enemyBattleSprite" width="72" height="72"></canvas>
        <div id="battleFxLayer"></div>
      </div>
      <div id="battleCommandArea">
        <div id="battleMsg">Choose an action.</div>
        <div class="battleActions">
          <button class="battleAction" id="attackBtn"><span class="actionName">ATTACK</span><span class="actionSub">Strike the enemy</span></button>
          <button class="battleAction" id="defendBtn"><span class="actionName">GUARD</span><span class="actionSub">Reduce the next hit</span></button>
          <button class="battleAction" id="potionBtn"><span class="actionName">POTION <span id="potionCount">(2)</span></span><span class="actionSub">Recover 14 HP</span></button>
          <button class="battleAction" id="runBtn"><span class="actionName">FLEE</span><span class="actionSub">Try to escape</span></button>
        </div>
      </div>
    </div>
  </div>
</div>
  <script src="./js/pwa.js"></script>
  <script src="./config/game-balance.js"></script>
  <script src="./config/keybinds.js"></script>
  <script src="./js/game.js"></script>
</body>
</html>
